<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js?v=1783862902"></script>
<script src="auth-guard.js?v=1784132091"></script>
<script src="cores-early.js?v=1784060144"></script>
<script src="page-transition.js?v=1783861010"></script>
<title>Calendário · OAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:opsz,wght@14..32,400..700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=1784043341">
<link rel="stylesheet" href="sessao.css"><link rel="stylesheet" href="topnav.css?v=1791163406"><script src="topnav.js?v=1791163406"></script></head>
<body>
<div class="aurora-bg" aria-hidden="true"><div class="aurora-blob ab1"></div><div class="aurora-blob ab2"></div><div class="aurora-blob ab3"></div><div class="aurora-blob ab4"></div></div>
<div class="app">
  <main>
    <div class="topbar"><div class="page-title"><div class="breadcrumb">Revisitar + praticar · 12 out → 10 jan</div><h1>Calendário até a <em>prova</em></h1></div></div>
    <style>
    .cv-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin-bottom:1.1rem}
    .cv-stat{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:.85rem 1rem}
    .cv-stat b{display:block;font-family:'Fraunces',serif;font-weight:500;font-size:1.6rem;color:var(--ink);line-height:1.1}
    .cv-stat span{font-size:.72rem;color:var(--ink-faded)}
    .cv-trilho{position:relative;height:6px;border-radius:6px;background:var(--line-soft);margin:.2rem 0 1.4rem;overflow:hidden}
    .cv-trilho i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:6px}
    .cv-fases{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faded);margin-bottom:.35rem}
    .cv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1.4rem;align-items:start}
    .cv-mes{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:1rem 1.1rem 1.1rem;margin-bottom:1.1rem;box-shadow:var(--shadow-sm)}
    .cv-mes h3{font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;margin:0 0 .7rem;color:var(--ink)}
    .cv-mes h3 small{font:500 .7rem Inter,sans-serif;color:var(--ink-faded);margin-left:.5rem;letter-spacing:.04em}
    .cv-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
    .cv-sem{font:600 .6rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faded);text-align:center;padding-bottom:.2rem}
    .cv-d{position:relative;min-height:84px;border-radius:10px;background:var(--bg-soft);border:1px solid transparent;padding:.4rem .4rem .35rem;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
    .cv-d:hover{border-color:var(--rose)}
    .cv-d.vazio{background:none;cursor:default;border:0;min-height:0}
    .cv-d .n{font:600 .78rem Inter,sans-serif;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center}
    .cv-d .ok{width:15px;height:15px;border-radius:50%;background:#5E8C6A;color:#fff;font-size:.58rem;display:grid;place-items:center}
    .cv-d.passado{opacity:.55}
    .cv-d.hoje{background:var(--paper);border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
    .cv-d.sel{border-color:var(--ink);background:var(--paper)}
    .cv-p{display:block;font:600 .6rem Inter,sans-serif;border-radius:5px;padding:.14rem .3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c,var(--rose-soft));color:var(--cd,var(--ink))}
    .cv-t{font:600 .6rem Inter,sans-serif;color:var(--ink-soft);border:1px dashed var(--line);border-radius:5px;padding:.14rem .3rem;text-align:center}
    .cv-t.sim{border-style:solid;border-color:var(--ink);color:var(--ink)}
    .cv-t.prova{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .cv-side{position:sticky;top:90px}
    .cv-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:1.2rem 1.2rem 1.1rem;box-shadow:var(--shadow-sm)}
    .cv-card .eb{font:600 .62rem Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faded)}
    .cv-card h4{font-family:'Fraunces',serif;font-weight:500;font-size:1.3rem;margin:.25rem 0 .8rem;color:var(--ink)}
    .cv-item{border-left:3px solid var(--cd,var(--rose));padding:.15rem 0 .15rem .7rem;margin-bottom:.7rem}
    .cv-item b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cd,var(--rose-deep))}
    .cv-item span{font-size:.88rem;color:var(--ink);line-height:1.4}
    .cv-item small{display:block;font-size:.72rem;color:var(--ink-faded);margin-top:.15rem}
    .cv-card .btn{width:100%;text-align:center;text-decoration:none;margin-top:.4rem}
    .cv-leg{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:1rem}
    .cv-leg .cv-p{display:inline-block;font-size:.62rem;padding:.2rem .5rem}
    @media (max-width:980px){.cv-wrap{grid-template-columns:1fr}.cv-side{position:static;order:-1}.cv-top{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:600px){
      .cv-fases span:nth-child(2){display:none}
      .cv-mes{padding:.8rem .6rem}
      .cv-grade{gap:3px}
      .cv-d{min-height:52px;padding:.3rem;gap:2px}
      .cv-d .n{font-size:.7rem}
      .cv-p,.cv-t{font-size:0;padding:0;height:5px;border-radius:3px;border-width:0}
      .cv-t{background:var(--line)}
      .cv-t.sim,.cv-t.prova{background:var(--ink)}
    }
    </style>
    <div class="cv-fases"><span>12 out · início</span><span>21 dez · revisão final</span><span>10 jan · prova</span></div>
    <div class="cv-trilho"><i id="cv-bar"></i></div>
    <div class="cv-top" id="cv-top"></div>
    <div class="cv-wrap">
      <div id="cal"></div>
      <aside class="cv-side"><div class="cv-card" id="cv-det"></div></aside>
    </div>
  </main>
</div>
<script src="script.js?v=1784021867"></script>
<script src="perfil.js?v=1783860863"></script>
<script src="sync.js?v=1784058237"></script>
<script src="progresso.js?v=1783859287"></script>
<script src="cores.js"></script>
<script src="estudo-core.js"></script>
<script src="erros-core.js"></script>
<script src="revisao-biblioteca.js"></script>
<script src="calendario-ativo.js"></script>
<script src="ativo-core.js"></script>
<script src="sessao-core.js"></script>
<script>
(function () {
  var S = SESSAO, CAL = CAL_ATIVO, esc = S.esc;
  var MESES_L = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var COR = {
    'Direito Constitucional': 'const', 'Direito Civil': 'civil', 'Direito Processual Civil': 'civil',
    'Direito Penal': 'penal', 'Direito Processual Penal': 'penal', 'Direito do Trabalho': 'trab',
    'Direito Processual do Trabalho': 'trab', 'Direito Tributário': 'tribut', 'Direito Empresarial': 'tribut',
    'Ética Profissional': 'etica', 'Direito Administrativo': 'const', 'ECA': 'etica', 'Direito do Consumidor': 'civil',
    'Direito Previdenciário': 'trab', 'Direito Eleitoral': 'const'
  };
  function cor(d) { var c = COR[d]; return c ? ' style="--c:var(--mat-' + c + ');--cd:var(--mat-' + c + '-deep)"' : ''; }
  function feitos() { try { return JSON.parse(localStorage.getItem('oab_ativo_check_v1')) || {}; } catch (e) { return {}; } }
  var POR = {}; CAL.dias.forEach(function (x) { POR[x.d] = x; });
  var sel = POR[S.HOJE] ? S.HOJE : CAL.dias[0].d;

  function chips(x) {
    if (x.top) return x.top.map(function (t) { return '<span class="cv-p"' + cor(t.d) + '>' + esc(S.curto(t.d)) + '</span>'; }).join('');
    if (x.tipo === 'simulado') return '<span class="cv-t sim">Simulado</span>';
    if (x.tipo === 'prova') return '<span class="cv-t prova">Prova</span>';
    if (x.tipo === 'vespera') return '<span class="cv-t">Véspera</span>';
    if (x.tipo === 'leve') return '<span class="cv-t">Leve</span>';
    return (x.foco || []).map(function (d) { return '<span class="cv-p"' + cor(d) + '>' + esc(S.curto(d)) + '</span>'; }).join('') + (x.sim ? '<span class="cv-t">Simulado</span>' : '');
  }

  function grade() {
    var f = feitos(), meses = [], h = '';
    CAL.dias.forEach(function (x) { var k = x.d.slice(0, 7); if (meses.indexOf(k) < 0) meses.push(k); });
    meses.forEach(function (k) {
      var a = +k.slice(0, 4), m = +k.slice(5, 7), ini = new Date(a, m - 1, 1), ult = new Date(a, m, 0).getDate();
      var dias = CAL.dias.filter(function (x) { return x.d.slice(0, 7) === k; });
      var est = dias.filter(function (x) { return x.top; }).length;
      h += '<section class="cv-mes"><h3>' + MESES_L[m - 1] + '<small>' + a + (est ? ' · ' + est + ' dias de conteúdo' : '') + '</small></h3><div class="cv-grade">' +
        ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(function (w) { return '<div class="cv-sem">' + w + '</div>'; }).join('');
      var cel = [];
      for (var i = 0; i < (ini.getDay() + 6) % 7; i++) cel.push(null);
      for (var d = 1; d <= ult; d++) cel.push(k + '-' + String(d).padStart(2, '0'));
      while (cel.length % 7) cel.push(null);
      for (var w = 0; w < cel.length; w += 7) {
        var semana = cel.slice(w, w + 7);
        if (!semana.some(function (iso) { return iso && POR[iso]; })) continue;
        semana.forEach(function (iso) {
          var x = iso && POR[iso];
          if (!x) { h += '<div class="cv-d vazio"></div>'; return; }
          var cls = 'cv-d' + (iso === S.HOJE ? ' hoje' : iso < S.HOJE ? ' passado' : '') + (iso === sel ? ' sel' : '');
          h += '<button type="button" class="' + cls + '" data-d="' + iso + '"><span class="n">' + (+iso.slice(8)) +
            (f[iso] && f[iso].feito ? '<span class="ok" title="Estudado">✓</span>' : '') + '</span>' + chips(x) + '</button>';
        });
      }
      h += '</div></section>';
    });
    document.getElementById('cal').innerHTML = h;
  }

  function detalhe() {
    var x = POR[sel], p = S.partes(sel), h;
    var tit = S.dataLonga(sel).replace(/^./, function (c) { return c.toUpperCase(); });
    var fase = x.f === 1 ? 'Fase 1 · conteúdo' : x.f === 2 ? 'Fase 2 · revisão final' : 'Prova';
    h = '<div class="eb">' + fase + (sel === S.HOJE ? ' · hoje' : '') + '</div><h4>' + esc(tit) + '</h4>';
    if (x.top) h += x.top.map(function (t) {
      return '<div class="cv-item"' + cor(t.d) + '><b>' + esc(S.curto(t.d)) + '</b><span>' + esc(t.s) + '</span>' +
        (t.n != null ? '<small>PDF do Dia ' + t.n + ' do VDE</small>' : '') + '</div>';
    }).join('');
    else h += '<div class="cv-item"><span>' + esc(S.resumoDoDia(x)) + '</span></div>';
    if (x.sim && x.tipo !== 'simulado') h += '<div class="cv-item"><b>Simulado</b><span>' + (x.sim.modo === 'completo' ? 'Completo · ' + x.sim.exame + 'º Exame' : 'Parcial · 20 questões') + '</span></div>';
    h += '<a class="btn btn-primary" href="hoje.html?data=' + sel + '">Abrir este dia</a>';
    h += '<div class="cv-leg">' + ['Direito Constitucional', 'Direito Civil', 'Direito Penal', 'Direito do Trabalho', 'Direito Tributário', 'Ética Profissional'].map(function (d) {
      return '<span class="cv-p"' + cor(d) + '>' + esc(S.curto(d)) + '</span>';
    }).join('') + '</div>';
    document.getElementById('cv-det').innerHTML = h;
  }

  function topo() {
    var f = feitos(), tot = CAL.dias.length, idx = S.indice(S.HOJE), passados = CAL.dias.filter(function (x) { return x.d <= S.HOJE; }).length;
    var est = CAL.dias.filter(function (x) { return f[x.d] && f[x.d].feito; }).length;
    var pdfs = CAL.dias.filter(function (x) { return x.d >= S.HOJE && x.top; }).reduce(function (n, x) { return n + x.top.length; }, 0);
    var sims = CAL.dias.filter(function (x) { return x.d >= S.HOJE && x.sim && x.sim.modo === 'completo'; }).length;
    document.getElementById('cv-top').innerHTML =
      '<div class="cv-stat"><b>' + (idx >= 0 ? idx + 1 : 0) + '<small style="font-size:.9rem;color:var(--ink-faded)"> / ' + tot + '</small></b><span>dia do calendário</span></div>' +
      '<div class="cv-stat"><b>' + est + '</b><span>dias marcados como estudados</span></div>' +
      '<div class="cv-stat"><b>' + pdfs + '</b><span>tópicos de conteúdo pela frente</span></div>' +
      '<div class="cv-stat"><b>' + sims + '</b><span>simulados completos pela frente</span></div>';
    document.getElementById('cv-bar').style.width = Math.max(1, passados / tot * 100) + '%';
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('.cv-d[data-d]'); if (!b) return;
    if (b.dataset.d === sel) { location.href = 'hoje.html?data=' + sel; return; }
    sel = b.dataset.d; grade(); detalhe();
    if (window.innerWidth <= 980) document.getElementById('cv-det').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('DOMContentLoaded', function () { topo(); grade(); detalhe(); });
})();
</script>
</body>
</html>
