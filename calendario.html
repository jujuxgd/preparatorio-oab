<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:opsz,wght@14..32,400..700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">

<body>
<div class="aurora-bg" aria-hidden="true"><div class="aurora-blob ab1"></div><div class="aurora-blob ab2"></div><div class="aurora-blob ab3"></div><div class="aurora-blob ab4"></div></div>
<div class="app">
  <main>
    <style>
    .ca{--fita-h:56px}
    .ca-sub{margin:.5rem 0 0;color:var(--ink-soft);font-size:.95rem;max-width:60ch;line-height:1.5}
    .ca-sub b{font-weight:600;color:var(--rose-deep)}

    /* fita: o plano inteiro num olhar */
    .ca-fita{position:relative;margin:0 0 2.2rem;padding:1.1rem 1.1rem .7rem;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg)}
    .ca-barras{display:flex;align-items:flex-end;gap:2px;height:var(--fita-h)}
    .ca-bar{flex:1;min-width:2px;height:62%;border:0;padding:0;cursor:pointer;border-radius:2px;background:var(--line);display:flex;flex-direction:column;overflow:hidden;transition:height .2s}
    .ca-bar i{flex:1;display:block}
    .ca-bar.sim{height:88%;background:var(--ink)}
    .ca-bar.rev{height:40%;background:repeating-linear-gradient(135deg,var(--rose-soft) 0 3px,var(--paper) 3px 6px);outline:1px solid var(--rose-soft)}
    .ca-bar.leve{height:26%;background:var(--line-soft)}
    .ca-bar.prova{height:100%;background:var(--rose-deep)}
    .ca-bar.fut{opacity:.72}
    .ca-bar.sel{height:100%;opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
    .ca-bar:hover{height:100%;opacity:1}
    .ca-bar:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .ca-agulha{position:absolute;width:2px;background:var(--rose-deep);border-radius:2px;pointer-events:none}
    .ca-agulha::after{content:'hoje';position:absolute;top:-1.2rem;left:50%;transform:translateX(-50%);font:600 .66rem Inter,sans-serif;color:var(--rose-deep)}
    .ca-marcos{display:flex;justify-content:space-between;margin-top:.55rem;font-size:.74rem;color:var(--ink-faded)}
    .ca-leg{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.8rem;font-size:.74rem;color:var(--ink-soft)}
    .ca-leg span{display:inline-flex;align-items:center;gap:.35rem}
    .ca-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--c)}

    .ca-wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:2rem;align-items:start}
    .ca-h2{font-family:'Fraunces',serif;font-weight:400;font-size:1.45rem;color:var(--ink);margin:0 0 .9rem}
    .ca-h2 small{font:400 .82rem Inter,sans-serif;color:var(--ink-faded);margin-left:.6rem}

    /* esta semana */
    .ca-semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.55rem;margin-bottom:2.4rem}
    .ca-dia{border:0;font:inherit;text-align:left;cursor:pointer;background:var(--paper);border-radius:var(--radius);padding:.75rem .7rem .8rem;min-height:170px;display:flex;flex-direction:column;gap:.45rem;box-shadow:inset 0 0 0 1px var(--line-soft);color:var(--ink)}
    .ca-dia:hover{box-shadow:inset 0 0 0 1.5px var(--rose)}
    .ca-dia.hoje{box-shadow:inset 0 0 0 2px var(--rose-deep)}
    .ca-dia.sel{box-shadow:inset 0 0 0 2px var(--ink)}
    .ca-dia.passado{color:var(--ink-soft)}
    .ca-dn{display:flex;align-items:baseline;justify-content:space-between}
    .ca-dn b{font-family:'Fraunces',serif;font-weight:400;font-size:1.9rem;line-height:1}
    .ca-dn span{font-size:.74rem;color:var(--ink-faded)}
    .ca-tema{font-size:.76rem;line-height:1.35;border-left:3px solid var(--cd,var(--line));padding-left:.45rem}
    .ca-tema strong{display:block;font-weight:600;font-size:.72rem;color:var(--cd,var(--ink-soft))}
    .ca-tipo{font-size:.78rem;color:var(--ink-soft);line-height:1.4}
    .ca-ok{margin-top:auto;font-size:.7rem;color:#4F7A5C}

    /* meses */
    .ca-meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.4rem}
    .ca-mes h3{font-family:'Fraunces',serif;font-weight:400;font-size:1.1rem;margin:0 0 .5rem;color:var(--ink)}
    .ca-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .ca-sem{font-size:.64rem;color:var(--ink-faded);text-align:center;padding-bottom:.15rem}
    .ca-c{aspect-ratio:1;border:0;padding:0;font:500 .72rem Inter,sans-serif;color:var(--ink-soft);background:var(--bg-soft);border-radius:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .ca-c.vazio{background:none;cursor:default}
    .ca-c .pts{display:flex;gap:2px}
    .ca-c .pts i{width:5px;height:5px;border-radius:50%;background:var(--c)}
    .ca-c.prova{background:var(--rose-deep);color:#fff}
    .ca-c.feito{background:var(--paper);box-shadow:inset 0 0 0 1.5px #6E9B79}
    .ca-c.hoje{box-shadow:inset 0 0 0 2px var(--rose-deep)}
    .ca-c.sel{box-shadow:inset 0 0 0 2px var(--ink)}
    .ca-c.passado:not(.feito){opacity:.5}
    .ca-c:focus-visible,.ca-dia:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

    /* painel do dia */
    .ca-side{position:sticky;top:90px}
    .ca-det{background:var(--paper);border-radius:var(--radius-lg);padding:1.3rem 1.3rem 1.2rem;box-shadow:inset 0 0 0 1px var(--line-soft)}
    .ca-det .data{font-family:'Fraunces',serif;font-size:1.5rem;line-height:1.15;color:var(--ink);margin:0 0 .2rem}
    .ca-det .fase{font-size:.8rem;color:var(--ink-faded);margin:0 0 1rem}
    .ca-it{border-left:3px solid var(--cd,var(--rose));padding:.1rem 0 .1rem .75rem;margin-bottom:.85rem}
    .ca-it strong{display:block;font-size:.78rem;color:var(--cd,var(--rose-deep))}
    .ca-it span{display:block;font-size:.92rem;line-height:1.4;color:var(--ink)}
    .ca-it small{display:block;font-size:.74rem;color:var(--ink-faded);margin-top:.15rem}
    .ca-det .btn{display:block;text-align:center;text-decoration:none;margin-top:.6rem}
    .ca-adi{font-size:.76rem;color:var(--rose-deep);margin:-.4rem 0 .9rem}

    @media (max-width:1020px){.ca-wrap{grid-template-columns:1fr}.ca-side{position:static;order:-1}}
    @media (max-width:760px){
      .ca-semana{grid-template-columns:1fr;gap:.45rem}
      .ca-dia{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:.4rem .8rem;padding:.7rem .8rem}
      .ca-dn{flex-direction:column;align-items:flex-start;min-width:46px}
      .ca-dia>div:not(.ca-dn){flex:1;min-width:0}
      .ca-ok{margin-top:0}
        .ca{--fita-h:44px}
      .ca-fita{padding:.9rem .7rem .6rem}
      .ca-barras{gap:1px}
    }
    @media (prefers-reduced-motion:reduce){.ca-bar{transition:none}}
    </style>
    <div class="ca">
      <div class="topbar">
        <div class="page-title">
          <h1>Até a prova</h1>
          <p id="ca-sub" class="ca-sub"></p>
        </div>
      </div>

      <section class="ca-fita" aria-label="O plano inteiro, um traço por dia">
        <div class="ca-barras" id="ca-barras"></div>
        <div class="ca-agulha" id="ca-agulha" hidden></div>
        <div class="ca-marcos"><span>12 out</span><span>21 dez, revisão final</span><span>10 jan, prova</span></div>
        <div class="ca-leg" id="ca-leg"></div>
      </section>

      <h2 class="ca-h2" id="ca-sem-tit">Esta semana</h2>
      <div class="ca-semana" id="ca-semana"></div>
      <div class="ca-wrap">
        <div>
          <h2 class="ca-h2">Mês a mês</h2>
          <div class="ca-meses" id="ca-meses"></div>
        </div>
        <aside class="ca-side"><div class="ca-det" id="ca-det" aria-live="polite"></div></aside>
      </div>
    </div>
  </main>
</div>
<script src="script.js?v=1784021867"></script>
<script src="perfil.js?v=1783860863"></script>
<script src="sync.js?v=1784058237"></script>
<script src="progresso.js?v=1783859287"></script>
<script src="cores.js"></script>
<script src="estudo-core.js"></script>
<script src="erros-core.js"></script>
<script src="revisao-biblioteca.js"></script>
<script src="calendario-ativo.js"></script>
<script src="plano-dinamico.js"></script>
<script src="ativo-core.js"></script>
<script src="sessao-core.js"></script>
<script>
(function () {
  var S = SESSAO, CAL = CAL_ATIVO, esc = S.esc;
  var MESES_L = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var COR = {
    'Direito Constitucional': 'const', 'Direito Administrativo': 'const', 'Direito Eleitoral': 'const',
    'Direito Civil': 'civil', 'Direito Processual Civil': 'civil', 'Direito do Consumidor': 'civil',
    'Direito Penal': 'penal', 'Direito Processual Penal': 'penal',
    'Direito do Trabalho': 'trab', 'Direito Processual do Trabalho': 'trab', 'Direito Previdenciário': 'trab',
    'Direito Tributário': 'tribut', 'Direito Empresarial': 'tribut',
    'Ética Profissional': 'etica', 'ECA': 'etica'
  };
  function vars(d) { var c = COR[d]; return c ? '--c:var(--mat-' + c + '-deep);--cd:var(--mat-' + c + '-deep)' : ''; }
  function feitos() { try { return JSON.parse(localStorage.getItem('oab_ativo_check_v1')) || {}; } catch (e) { return {}; } }
  var POR = {}; CAL.dias.forEach(function (x) { POR[x.d] = x; });
  var HOJE = S.HOJE, sel = POR[HOJE] ? HOJE : CAL.dias[0].d;
  function dt(iso) { return new Date(iso + 'T12:00:00'); }
  function dm(iso) { var p = S.partes(iso); return p.d + '/' + String(p.m).padStart(2, '0'); }
  function temas(x) {
    if (!x.top) return [];
    var vist = {}, out = [];
    x.top.forEach(function (t) { var k = t.d + t.s; if (!vist[k]) { vist[k] = 1; out.push(t); } });
    return out;
  }
  function tipoTxt(x) {
    if (x.tipo === 'simulado') return 'Simulado completo, ' + x.sim.exame + 'º Exame';
    if (x.tipo === 'prova') return 'Prova da 1ª fase, 13h às 18h';
    if (x.tipo === 'vespera') return 'Véspera: só flashcards leves';
    if (x.tipo === 'leve') return 'Dia leve: flashcards e 10 questões de Ética';
    if (x.tipo === 'revisao') return (x.extra ? 'Revisão extra de ' : 'Revisão de ') + x.foco.map(S.curto).join(' e ') + (x.sim ? (x.sim.modo === 'completo' ? ', com simulado completo' : ', com simulado de 20 questões') : '');
    return '';
  }

  function cabecalho() {
    var f = feitos(), faltam = Math.max(0, Math.round((dt('2027-01-10') - dt(HOJE)) / 864e5));
    var est = CAL.dias.filter(function (x) { return f[x.d] && f[x.d].feito; }).length;
    var pdfs = 0; CAL.dias.forEach(function (x) { if (x.d >= HOJE && x.top) pdfs += temas(x).length; });
    var fim = window.PLANO ? PLANO.fimDoConteudo() : null;
    document.getElementById('ca-sub').innerHTML = '<b>' + faltam + (faltam === 1 ? ' dia' : ' dias') + '</b> até 10 de janeiro. ' + (HOJE < CAL.dias[0].d ? 'Começa segunda, 12 de outubro. ' : '') +
      pdfs + ' temas pela frente' + (fim ? ', o último em ' + dm(fim) : '') + '. ' +
      (est ? est + (est === 1 ? ' dia marcado como estudado.' : ' dias marcados como estudados.') : '');
  }

  function fita() {
    var f = feitos();
    document.getElementById('ca-barras').innerHTML = CAL.dias.map(function (x) {
      var cls = 'ca-bar' + (x.d > HOJE ? ' fut' : '') + (x.d === sel ? ' sel' : ''), dentro = '';
      if (x.top && !x.extra) dentro = temas(x).map(function (t) { return '<i style="background:var(--mat-' + (COR[t.d] || 'const') + '-deep)"></i>'; }).join('');
      else if (x.tipo === 'simulado') cls += ' sim';
      else if (x.tipo === 'prova') cls += ' prova';
      else if (x.tipo === 'leve' || x.tipo === 'vespera') cls += ' leve';
      else cls += ' rev';
      if (x.top && x.tipo === 'simulado') cls += ' sim';
      var rot = S.dataLonga(x.d) + ': ' + (x.top ? temas(x).map(function (t) { return S.curto(t.d); }).join(' e ') : tipoTxt(x)) + (f[x.d] && f[x.d].feito ? ' (estudado)' : '');
      return '<button type="button" class="' + cls + '" data-d="' + x.d + '" title="' + esc(rot) + '" aria-label="' + esc(rot) + '">' + dentro + '</button>';
    }).join('');
    var ag = document.getElementById('ca-agulha'), b = document.querySelector('.ca-bar[data-d="' + HOJE + '"]');
    var br = document.getElementById('ca-barras');
    if (b) { ag.hidden = false; ag.style.left = (b.offsetLeft + b.offsetWidth / 2 - 1) + 'px'; ag.style.top = (br.offsetTop - 6) + 'px'; ag.style.height = (br.offsetHeight + 10) + 'px'; } else ag.hidden = true;
    var usadas = [];
    CAL.dias.forEach(function (x) { temas(x).forEach(function (t) { var c = COR[t.d]; if (c && usadas.indexOf(c) < 0) usadas.push(c); }); });
    var NOMES = { const: 'Constitucional, Administrativo', civil: 'Civil, Proc. Civil, Consumidor', penal: 'Penal, Proc. Penal', trab: 'Trabalho, Proc. Trabalho', tribut: 'Tributário, Empresarial', etica: 'Ética, ECA' };
    document.getElementById('ca-leg').innerHTML = Object.keys(NOMES).map(function (c) { return '<span style="--c:var(--mat-' + c + '-deep)"><i></i>' + NOMES[c] + '</span>'; }).join('') +
      '<span style="--c:var(--ink)"><i></i>Simulado</span><span><i style="background:repeating-linear-gradient(135deg,var(--rose-soft) 0 2px,var(--paper) 2px 4px);outline:1px solid var(--rose-soft)"></i>Revisão</span>';
  }

  function semana() {
    var f = feitos(), base = dt(sel), seg = new Date(base); seg.setDate(base.getDate() - ((base.getDay() + 6) % 7));
    var dias = [];
    for (var i = 0; i < 7; i++) { var d = new Date(seg); d.setDate(seg.getDate() + i); dias.push(S.partes ? (d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')) : ''); }
    var naSemana = dias.indexOf(HOJE) >= 0;
    document.getElementById('ca-sem-tit').innerHTML = (naSemana ? 'Esta semana' : 'Semana de ' + dm(dias[0])) + '<small>' + dm(dias[0]) + ' a ' + dm(dias[6]) + '</small>';
    document.getElementById('ca-semana').innerHTML = dias.map(function (iso) {
      var x = POR[iso], p = dt(iso);
      if (!x) return '<div class="ca-dia passado" style="cursor:default;box-shadow:none;background:none"><div class="ca-dn"><b>' + p.getDate() + '</b><span>' + SEM[p.getDay()] + '</span></div></div>';
      var cls = 'ca-dia' + (iso === HOJE ? ' hoje' : iso < HOJE ? ' passado' : '') + (iso === sel ? ' sel' : '');
      var corpo = x.top ? temas(x).map(function (t) { return '<div class="ca-tema" style="' + vars(t.d) + '"><strong>' + esc(S.curto(t.d)) + '</strong>' + esc(t.s) + '</div>'; }).join('') +
        (x.tipo === 'simulado' ? '<div class="ca-tipo">' + esc(tipoTxt(x)) + '</div>' : '')
        : '<div class="ca-tipo">' + esc(tipoTxt(x)) + '</div>';
      return '<button type="button" class="' + cls + '" data-d="' + iso + '"><div class="ca-dn"><b>' + p.getDate() + '</b><span>' + SEM[p.getDay()] + (iso === HOJE ? ', hoje' : '') + '</span></div>' +
        '<div>' + corpo + '</div>' + (f[iso] && f[iso].feito ? '<div class="ca-ok">Estudado ✓</div>' : '') + '</button>';
    }).join('');
  }

  function meses() {
    var f = feitos(), chaves = [];
    CAL.dias.forEach(function (x) { var k = x.d.slice(0, 7); if (chaves.indexOf(k) < 0) chaves.push(k); });
    document.getElementById('ca-meses').innerHTML = chaves.map(function (k) {
      var a = +k.slice(0, 4), m = +k.slice(5, 7), ini = new Date(a, m - 1, 1), ult = new Date(a, m, 0).getDate(), h = '';
      for (var i = 0; i < (ini.getDay() + 6) % 7; i++) h += '<span class="ca-c vazio"></span>';
      for (var d = 1; d <= ult; d++) {
        var iso = k + '-' + String(d).padStart(2, '0'), x = POR[iso];
        if (!x) { h += '<span class="ca-c vazio" style="color:var(--line)">' + d + '</span>'; continue; }
        var cls = 'ca-c' + (x.tipo === 'simulado' && !x.top ? ' sim' : '') + (x.tipo === 'prova' ? ' prova' : '') + (f[iso] && f[iso].feito ? ' feito' : '') +
          (iso === HOJE ? ' hoje' : iso < HOJE ? ' passado' : '') + (iso === sel ? ' sel' : '');
        var pts = x.top ? temas(x).slice(0, 3).map(function (t) { return '<i style="--c:var(--mat-' + (COR[t.d] || 'const') + '-deep)"></i>'; }).join('') : '';
        if (x.tipo === 'simulado' || (x.sim && x.sim.modo === 'completo')) pts += '<i style="--c:var(--ink)"></i>';
        pts = pts ? '<span class="pts">' + pts + '</span>' : '';
        h += '<button type="button" class="' + cls + '" data-d="' + iso + '" aria-label="' + esc(S.dataLonga(iso)) + '">' + d + pts + '</button>';
      }
      return '<div class="ca-mes"><h3>' + MESES_L[m - 1] + '</h3><div class="ca-grade">' +
        ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(function (w) { return '<span class="ca-sem">' + w + '</span>'; }).join('') + h + '</div></div>';
    }).join('');
  }

  function detalhe() {
    var x = POR[sel], f = feitos();
    var tit = S.dataLonga(sel).replace(/^./, function (c) { return c.toUpperCase(); });
    var fase = x.f === 1 ? 'Fase de conteúdo' : x.f === 2 ? 'Revisão final' : 'Dia da prova';
    var h = '<p class="data">' + esc(tit) + '</p><p class="fase">' + fase + (sel === HOJE ? ', hoje' : '') + (f[sel] && f[sel].feito ? ', estudado ✓' : '') + '</p>';
    if (x.adiantado) h += '<p class="ca-adi">Você adiantou conteúdo para este dia.</p>';
    if (x.top) h += temas(x).map(function (t) {
      return '<div class="ca-it" style="' + vars(t.d) + '"><strong>' + esc(S.curto(t.d)) + '</strong><span>' + esc(t.s) + '</span>' +
        (t.n != null ? '<small>PDF do Dia ' + t.n + ' do VDE' + (t.k ? ', DICAS ' + t.k[0] + ' a ' + t.k[1] + ' do Gabaritaço' : '') + '</small>' : '') + '</div>';
    }).join('');
    if (!x.top || x.tipo === 'simulado') h += '<div class="ca-it"><span>' + esc(tipoTxt(x)) + '</span></div>';
    h += '<a class="btn btn-primary" href="hoje.html?data=' + sel + '">Abrir este dia</a>';
    document.getElementById('ca-det').innerHTML = h;
  }

  function tudo() { fita(); semana(); meses(); detalhe(); }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-d]'); if (!b || !POR[b.dataset.d]) return;
    if (b.classList.contains('ca-dia')) { location.href = 'hoje.html?data=' + b.dataset.d; return; }
    sel = b.dataset.d; tudo();
    if (window.innerWidth <= 1020) document.getElementById('ca-det').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(fita, 150); });
  document.addEventListener('DOMContentLoaded', function () { cabecalho(); tudo(); });
})();
</script>
</body>
</html>
