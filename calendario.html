<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js?v=1783862902"></script>
<script src="auth-guard.js?v=1784132091"></script>
<script src="cores-early.js?v=1784060144"></script>

<title>Calendário · OAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:opsz,wght@14..32,400..700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=1784043341">
<link rel="stylesheet" href="sessao.css"><link rel="stylesheet" href="topnav.css?v=1791163406"><script src="topnav.js?v=1791163406"></script></head>
<body>
<div class="aurora-bg" aria-hidden="true"><div class="aurora-blob ab1"></div><div class="aurora-blob ab2"></div><div class="aurora-blob ab3"></div><div class="aurora-blob ab4"></div></div>
<div class="app">
  <main>
    <style>
    .ca-sub{margin:.5rem 0 0;color:var(--ink-soft);font-size:.95rem;max-width:60ch;line-height:1.5}
    .ca-sub b{font-weight:600;color:var(--rose-deep)}
    .ca-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1.4rem;align-items:start;margin-top:1.4rem}
    .ca-mesbox{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:1.3rem 1.4rem 1.1rem}
    .ca-mesnav{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
    .ca-mesnav h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.35rem;margin:0;color:var(--ink);min-width:9.5em;text-align:center}
    .ca-mesnav button{border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;height:34px;min-width:34px;padding:0 .8rem;font:500 .82rem Inter,sans-serif;cursor:pointer}
    .ca-mesnav button:hover:not(:disabled){border-color:var(--rose);color:var(--ink)}
    .ca-mesnav button:disabled{opacity:.35;cursor:default}
    .ca-mesnav .ca-hojebtn{margin-left:auto}
    .ca-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .ca-sem{font:600 .64rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faded);text-align:center;padding-bottom:.2rem}
    .ca-c{min-height:104px;border:1px solid var(--line-soft);background:var(--paper);border-radius:12px;padding:.45rem .5rem .5rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:.3rem;overflow:hidden;transition:border-color .15s,box-shadow .15s}
    .ca-c:hover{border-color:var(--rose)}
    .ca-c:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .ca-c.vazio{background:none;border-color:transparent;cursor:default}
    .ca-c.fora{background:none;border-color:transparent;cursor:default;opacity:.35;min-height:0}
    .ca-n{display:flex;align-items:center;justify-content:space-between;font:600 .8rem Inter,sans-serif;color:var(--ink-soft)}
    .ca-n .ok{font-size:.7rem;color:#4F7A5C}
    .ca-c.hoje{border:1.5px solid var(--rose-deep);box-shadow:0 0 0 3px var(--rose-soft)}
    .ca-c.hoje .ca-n b{background:var(--rose-deep);color:var(--paper);border-radius:999px;padding:0 .45rem}
    .ca-c.sel{border:1.5px solid var(--ink)}
    .ca-c.passado:not(.feito){opacity:.6}
    .ca-t{border-left:3px solid var(--cd,var(--line));padding-left:.35rem;font-size:.7rem;line-height:1.25;color:var(--ink-soft);min-width:0}
    .ca-t .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ca-t strong{display:block;font-size:.66rem;font-weight:600;color:var(--cd,var(--ink-soft));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ca-tag{align-self:flex-start;font:600 .62rem Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.18rem .5rem;background:var(--rose-soft);color:var(--rose-deep)}
    .ca-tag.sim{background:var(--ink);color:var(--paper)}
    .ca-tag.prova{background:var(--rose-deep);color:var(--paper)}
    .ca-tag.leve{background:var(--bg-soft,var(--bg));color:var(--ink-faded)}
    .ca-leg{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:1rem;font-size:.74rem;color:var(--ink-soft)}
    .ca-leg span{display:inline-flex;align-items:center;gap:.35rem}
    .ca-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--c)}
    .ca-side{position:sticky;top:90px}
    .ca-det{background:var(--paper);border-radius:var(--radius-lg);padding:1.3rem 1.3rem 1.2rem;border:1px solid var(--line-soft)}
    .ca-det .data{font-family:'Fraunces',serif;font-size:1.4rem;line-height:1.15;color:var(--ink);margin:0 0 .2rem}
    .ca-det .fase{font-size:.8rem;color:var(--ink-faded);margin:0 0 1rem}
    .ca-it{border-left:3px solid var(--cd,var(--rose));padding:.1rem 0 .1rem .75rem;margin-bottom:.85rem}
    .ca-it strong{display:block;font-size:.78rem;color:var(--cd,var(--rose-deep))}
    .ca-it span{display:block;font-size:.92rem;line-height:1.4;color:var(--ink)}
    .ca-it small{display:block;font-size:.74rem;color:var(--ink-faded);margin-top:.15rem}
    .ca-det .btn{display:block;text-align:center;text-decoration:none;margin-top:.6rem}
    .ca-adi{font-size:.76rem;color:var(--rose-deep);margin:-.4rem 0 .9rem}
    @media (max-width:1020px){.ca-wrap{grid-template-columns:1fr}.ca-side{position:static}}
    @media (max-width:640px){
      .ca-mesbox{padding:1rem .7rem}
      .ca-grade{gap:4px}
      .ca-c{min-height:54px;padding:.3rem;align-items:center}
      .ca-n{justify-content:center}
      .ca-n .ok{display:none}
      .ca-t{border:0;padding:0;width:8px;height:8px;border-radius:50%;background:var(--cd);font-size:0}
      .ca-t strong,.ca-t .tx{display:none}
      .ca-tag{font-size:0;padding:0;width:8px;height:8px;align-self:center}
      .ca-mesnav h2{font-size:1.1rem;min-width:0;flex:1}
    }
    </style>
    <div class="ca">
      <div class="topbar">
        <div class="page-title">
          <div class="breadcrumb">Calendário · <span data-month-year>—</span></div>
          <h1>Até a <em>prova</em></h1>
          <p id="ca-sub" class="ca-sub"></p>
        </div>
      </div>

      <div class="ca-wrap">
        <section class="ca-mesbox" aria-label="Calendário do mês">
          <div class="ca-mesnav">
            <button type="button" id="ca-ant" aria-label="Mês anterior">‹</button>
            <h2 id="ca-mestit"></h2>
            <button type="button" id="ca-prox" aria-label="Próximo mês">›</button>
            <button type="button" class="ca-hojebtn" id="ca-hojebtn">Hoje</button>
          </div>
          <div class="ca-grade" id="ca-grade"></div>
          <div class="ca-leg" id="ca-leg"></div>
        </section>
        <aside class="ca-side"><div class="ca-det" id="ca-det" aria-live="polite"></div></aside>
      </div>
    </div>
  </main>
</div>
<script src="script.js?v=1784021867"></script>
<script src="perfil.js?v=1783860863"></script>
<script src="sync.js?v=1784058237"></script>
<script src="progresso.js?v=1783859287"></script>
<script src="cores.js"></script>
<script src="estudo-core.js"></script>
<script src="erros-core.js"></script>
<script src="revisao-biblioteca.js"></script>
<script src="calendario-ativo.js"></script>
<script src="plano-dinamico.js"></script>
<script src="ativo-core.js"></script>
<script src="sessao-core.js"></script>
<script>
(function () {
  var S = SESSAO, CAL = CAL_ATIVO, esc = S.esc;
  var MESES_L = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var COR = {
    'Direito Constitucional': 'const', 'Direito Administrativo': 'const', 'Direito Eleitoral': 'const',
    'Direito Civil': 'civil', 'Direito Processual Civil': 'civil', 'Direito do Consumidor': 'civil',
    'Direito Penal': 'penal', 'Direito Processual Penal': 'penal',
    'Direito do Trabalho': 'trab', 'Direito Processual do Trabalho': 'trab', 'Direito Previdenciário': 'trab',
    'Direito Tributário': 'tribut', 'Direito Empresarial': 'tribut',
    'Ética Profissional': 'etica', 'ECA': 'etica'
  };
  function vars(d) { var c = COR[d]; return c ? '--c:var(--mat-' + c + '-deep);--cd:var(--mat-' + c + '-deep)' : ''; }
  function feitos() { try { return JSON.parse(localStorage.getItem('oab_ativo_check_v1')) || {}; } catch (e) { return {}; } }
  var POR = {}; CAL.dias.forEach(function (x) { POR[x.d] = x; });
  var HOJE = S.HOJE, sel = POR[HOJE] ? HOJE : CAL.dias[0].d;
  function dt(iso) { return new Date(iso + 'T12:00:00'); }
  function dm(iso) { var p = S.partes(iso); return p.d + '/' + String(p.m).padStart(2, '0'); }
  function temas(x) {
    if (!x.top) return [];
    var vist = {}, out = [];
    x.top.forEach(function (t) { var k = t.d + t.s; if (!vist[k]) { vist[k] = 1; out.push(t); } });
    return out;
  }
  function tipoTxt(x) {
    if (x.tipo === 'simulado') return 'Simulado completo, ' + x.sim.exame + 'º Exame';
    if (x.tipo === 'prova') return 'Prova da 1ª fase, 13h às 18h';
    if (x.tipo === 'vespera') return 'Véspera: só flashcards leves';
    if (x.tipo === 'leve') return 'Dia leve: flashcards e 10 questões de Ética';
    if (x.tipo === 'revisao') return (x.extra ? 'Revisão extra de ' : 'Revisão de ') + x.foco.map(S.curto).join(' e ') + (x.sim ? (x.sim.modo === 'completo' ? ', com simulado completo' : ', com simulado de 20 questões') : '');
    return '';
  }

  function cabecalho() {
    var f = feitos(), faltam = Math.max(0, Math.round((dt('2027-01-10') - dt(HOJE)) / 864e5));
    var est = CAL.dias.filter(function (x) { return f[x.d] && f[x.d].feito; }).length;
    var pdfs = 0; CAL.dias.forEach(function (x) { if (x.d >= HOJE && x.top) pdfs += temas(x).length; });
    var fim = window.PLANO ? PLANO.fimDoConteudo() : null;
    document.getElementById('ca-sub').innerHTML = '<b>' + faltam + (faltam === 1 ? ' dia' : ' dias') + '</b> até 10 de janeiro. ' + (HOJE < CAL.dias[0].d ? 'Começa segunda, 12 de outubro. ' : '') +
      pdfs + ' temas pela frente' + (fim ? ', o último em ' + dm(fim) : '') + '. ' +
      (est ? est + (est === 1 ? ' dia marcado como estudado.' : ' dias marcados como estudados.') : '');
  }

  var MESES_CAL = []; CAL.dias.forEach(function (x) { var k = x.d.slice(0, 7); if (MESES_CAL.indexOf(k) < 0) MESES_CAL.push(k); });
  var mesAt = sel.slice(0, 7);
  function legenda() {
    var NOMES = { const: 'Constitucional, Administrativo', civil: 'Civil, Proc. Civil, Consumidor', penal: 'Penal, Proc. Penal', trab: 'Trabalho, Proc. Trabalho', tribut: 'Tributário, Empresarial', etica: 'Ética, ECA' };
    document.getElementById('ca-leg').innerHTML = Object.keys(NOMES).map(function (c) { return '<span style="--c:var(--mat-' + c + '-deep)"><i></i>' + NOMES[c] + '</span>'; }).join('') +
      '<span style="--c:var(--ink)"><i></i>Simulado</span><span style="--c:var(--rose-soft)"><i></i>Revisão</span>';
  }
  function mes() {
    var f = feitos(), k = mesAt, m = +k.slice(5), y = +k.slice(0, 4);
    var ini = new Date(y, m - 1, 1), ult = new Date(y, m, 0).getDate(), h = '';
    ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].forEach(function (w) { h += '<span class="ca-sem">' + w + '</span>'; });
    // semanas inteiras fora do plano (antes de 12/10, depois de 10/01) não aparecem
    var dPlano = []; for (var j = 1; j <= ult; j++) if (POR[k + '-' + String(j).padStart(2, '0')]) dPlano.push(j);
    var dow = function (j) { return (new Date(y, m - 1, j).getDay() + 6) % 7; };
    var d0 = Math.max(1, dPlano[0] - dow(dPlano[0])), dN = Math.min(ult, dPlano[dPlano.length - 1] + 6 - dow(dPlano[dPlano.length - 1]));
    for (var i = 0; i < dow(d0); i++) h += '<span class="ca-c vazio"></span>';
    for (var d = d0; d <= dN; d++) {
      var iso = k + '-' + String(d).padStart(2, '0'), x = POR[iso];
      if (!x) { h += '<span class="ca-c fora"><span class="ca-n"><b>' + d + '</b></span></span>'; continue; }
      var ok = f[iso] && f[iso].feito;
      var cls = 'ca-c' + (iso === HOJE ? ' hoje' : iso < HOJE ? ' passado' : '') + (iso === sel ? ' sel' : '') + (ok ? ' feito' : '');
      var corpo = '';
      if (x.tipo === 'prova') corpo = '<span class="ca-tag prova">Prova</span>';
      else if (x.top && x.tipo !== 'simulado') corpo = temas(x).slice(0, 2).map(function (t) { return '<span class="ca-t" style="' + vars(t.d) + '"><strong>' + esc(S.curto(t.d)) + '</strong><span class="tx">' + esc(t.s) + '</span></span>'; }).join('');
      else if (x.tipo === 'simulado') corpo = '<span class="ca-tag sim">Simulado</span>';
      else if (x.tipo === 'revisao') corpo = '<span class="ca-tag">Revisão</span>';
      else corpo = '<span class="ca-tag leve">' + (x.tipo === 'vespera' ? 'Véspera' : 'Leve') + '</span>';
      h += '<button type="button" class="' + cls + '" data-d="' + iso + '" aria-label="' + esc(S.dataLonga(iso) + ': ' + (x.top ? temas(x).map(function (t) { return S.curto(t.d) + ', ' + t.s; }).join('; ') : tipoTxt(x))) + '">' +
        '<span class="ca-n"><b>' + d + '</b>' + (ok ? '<span class="ok">✓</span>' : '') + '</span>' + corpo + '</button>';
    }
    document.getElementById('ca-grade').innerHTML = h;
    document.getElementById('ca-mestit').textContent = MESES_L[m - 1] + ' ' + y;
    var i2 = MESES_CAL.indexOf(k);
    document.getElementById('ca-ant').disabled = i2 <= 0;
    document.getElementById('ca-prox').disabled = i2 >= MESES_CAL.length - 1;
  }

  function detalhe() {
    var x = POR[sel], f = feitos();
    var tit = S.dataLonga(sel).replace(/^./, function (c) { return c.toUpperCase(); });
    var fase = x.f === 1 ? 'Fase de conteúdo' : x.f === 2 ? 'Revisão final' : 'Dia da prova';
    var h = '<p class="data">' + esc(tit) + '</p><p class="fase">' + fase + (sel === HOJE ? ', hoje' : '') + (f[sel] && f[sel].feito ? ', estudado ✓' : '') + '</p>';
    if (x.adiantado) h += '<p class="ca-adi">Você adiantou conteúdo para este dia.</p>';
    if (x.top) h += temas(x).map(function (t) {
      return '<div class="ca-it" style="' + vars(t.d) + '"><strong>' + esc(S.curto(t.d)) + '</strong><span>' + esc(t.s) + '</span>' +
        (t.n != null ? '<small>PDF do Dia ' + t.n + ' do VDE' + (t.k ? ', DICAS ' + t.k[0] + ' a ' + t.k[1] + ' do Gabaritaço' : '') + '</small>' : '') + '</div>';
    }).join('');
    if (!x.top || x.tipo === 'simulado') h += '<div class="ca-it"><span>' + esc(tipoTxt(x)) + '</span></div>';
    h += '<a class="btn btn-primary" href="hoje.html?data=' + sel + '">Abrir este dia</a>';
    document.getElementById('ca-det').innerHTML = h;
  }

  function tudo() { mes(); detalhe(); }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-d]');
    if (b && POR[b.dataset.d]) {
      sel = b.dataset.d; tudo();
      if (window.innerWidth <= 1020) document.getElementById('ca-det').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var i = MESES_CAL.indexOf(mesAt);
    if (ev.target.closest('#ca-ant') && i > 0) { mesAt = MESES_CAL[i - 1]; mes(); }
    else if (ev.target.closest('#ca-prox') && i < MESES_CAL.length - 1) { mesAt = MESES_CAL[i + 1]; mes(); }
    else if (ev.target.closest('#ca-hojebtn')) { sel = POR[HOJE] ? HOJE : CAL.dias[0].d; mesAt = sel.slice(0, 7); tudo(); }
  });
  document.addEventListener('DOMContentLoaded', function () { cabecalho(); legenda(); tudo(); });
})();
</script>
</body>
</html>
