<body>
<div class="aurora-bg" aria-hidden="true"><div class="aurora-blob ab1"></div><div class="aurora-blob ab2"></div><div class="aurora-blob ab3"></div><div class="aurora-blob ab4"></div></div>
<div class="app">
  <main>
    <style>
    .in{max-width:1080px}
    .in-cab{margin:.4rem 0 1.5rem}
    .in-cab h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.05;margin:0;color:var(--ink)}
    .in-cab p{margin:.45rem 0 0;font-size:.95rem;color:var(--ink-soft);line-height:1.5}
    .in-cab p b{font-weight:600;color:var(--rose-deep)}

    .in-grade{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1.2rem;align-items:start}
    .in-hoje{background:var(--paper);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--line-soft);padding:1.5rem 1.6rem 1.4rem}
    .in-hoje-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem;font-size:.82rem;color:var(--ink-faded)}
    .in-temas{display:grid;gap:.9rem;margin-bottom:1.3rem}
    .in-tema{border-left:4px solid var(--cd,var(--rose));padding:.1rem 0 .1rem .9rem}
    .in-tema span{display:block;font-size:.8rem;font-weight:600;color:var(--cd,var(--rose-deep))}
    .in-tema strong{display:block;font-family:'Fraunces',serif;font-weight:400;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.2;color:var(--ink)}
    .in-tipo{font-family:'Fraunces',serif;font-size:1.4rem;line-height:1.3;color:var(--ink);margin:0 0 1.3rem}
    .in-acao{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .in-acao .btn{text-decoration:none}
    .in-ck{font-size:.84rem;color:var(--ink-soft)}
    .in-ck.ok{color:#4F7A5C;font-weight:500}

    .in-lado{display:grid;gap:.7rem}
    .in-fato{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;background:var(--paper);border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--line-soft);padding:.85rem 1rem;text-decoration:none;color:var(--ink)}
    .in-fato:hover{box-shadow:inset 0 0 0 1.5px var(--rose)}
    .in-fato:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .in-fato span{font-size:.86rem;color:var(--ink-soft);line-height:1.35}
    .in-fato small{display:block;font-size:.74rem;color:var(--ink-faded)}
    .in-fato b{font-family:'Fraunces',serif;font-weight:400;font-size:1.6rem;line-height:1;color:var(--ink)}

    .in-h2{font-family:'Fraunces',serif;font-weight:400;font-size:1.35rem;color:var(--ink);margin:2.2rem 0 .8rem}
    .in-prog{background:var(--paper);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--line-soft);padding:1.2rem 1.4rem}
    .in-prog p{margin:0 0 .7rem;font-size:.9rem;color:var(--ink-soft);line-height:1.5}
    .in-prog p b{color:var(--ink);font-weight:600}
    .in-barra{display:flex;gap:2px;height:14px}
    .in-barra i{flex:1;border-radius:2px;background:var(--line)}
    .in-barra i.ok{background:var(--cd)}
    .in-prox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
    .in-dia{display:block;background:var(--paper);border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--line-soft);padding:.85rem 1rem;text-decoration:none;color:var(--ink)}
    .in-dia:hover{box-shadow:inset 0 0 0 1.5px var(--rose)}
    .in-dia:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .in-dia em{display:block;font-style:normal;font-size:.78rem;color:var(--ink-faded);margin-bottom:.35rem}
    .in-dia .in-tema{padding-left:.6rem;border-left-width:3px;margin-top:.3rem}
    .in-dia .in-tema span{font-size:.72rem}
    .in-dia .in-tema strong{font-family:Inter,sans-serif;font-size:.84rem;line-height:1.35}
    .in-dia p{margin:0;font-size:.84rem;color:var(--ink-soft);line-height:1.4}

    .in-humor{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin-top:2.2rem;font-size:.88rem;color:var(--ink-soft)}
    .in-humor .mood-options{display:flex;gap:.4rem}
    .in-humor .mood-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.05rem;padding:0}
    .in-humor .mood-btn.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
    .in-humor .mood-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .in-rodape{display:flex;gap:1.2rem;flex-wrap:wrap;margin:2.4rem 0 .5rem;font-size:.8rem}
    .in-rodape a,.in-rodape button{color:var(--ink-faded);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
    .in-rodape a:hover,.in-rodape button:hover{color:var(--ink)}

    @media (max-width:900px){
      .in-grade{grid-template-columns:1fr}
      .in-lado{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
      .in-prox{grid-template-columns:1fr}
    }
    @media (max-width:640px){ .in-hoje{padding:1.2rem 1.1rem} }
    </style>

    <div class="in">
      <header class="in-cab">
        <h1 id="in-ola">Olá</h1>
        <p id="in-sub"></p>
      </header>

      <div class="in-grade">
        <section class="in-hoje" aria-labelledby="in-hoje-tit">
          <div class="in-hoje-top"><span id="in-hoje-tit"></span><span id="in-hoje-dia"></span></div>
          <div id="in-hoje-corpo"></div>
          <div class="in-acao">
            <a class="btn btn-primary" href="hoje.html" id="in-abrir">Abrir o dia</a>
            <span class="in-ck" id="in-ck"></span>
          </div>
        </section>
        <div class="in-lado" id="in-lado"></div>
      </div>

      <h2 class="in-h2">Conteúdo do VDE</h2>
      <section class="in-prog">
        <p id="in-prog-txt"></p>
        <div class="in-barra" id="in-barra" role="img"></div>
      </section>

      <h2 class="in-h2">Próximos dias</h2>
      <div class="in-prox" id="in-prox"></div>

      <div class="in-humor">
        <span>Como você está hoje?</span>
        <div class="mood-options">
          <button class="mood-btn" data-mood="Cansada" aria-label="Cansada">🌙</button>
          <button class="mood-btn" data-mood="Perdida" aria-label="Perdida">🌀</button>
          <button class="mood-btn" data-mood="Focada" aria-label="Focada">✨</button>
          <button class="mood-btn" data-mood="Confiante" aria-label="Confiante">⚡</button>
          <button class="mood-btn" data-mood="Empolgada" aria-label="Empolgada">🎉</button>
        </div>
        <span id="mood-text"></span>
      </div>

      <div class="in-rodape">
        <a href="https://drive.google.com/file/d/1MlMhae3vIQ0wkrrPzk-Vk2FktiXKrMxf/view" target="_blank" rel="noopener">Apostila completa no Drive</a>
        <button type="button" onclick="resetarTudo()">Apagar todo o progresso</button>
      </div>
    </div>
  </main>
</div>
<script src="script.js?v=1784021867"></script>
<script src="perfil.js?v=1783860863"></script>
<script src="sync.js?v=1784058237"></script>
<script src="progresso.js?v=1783859287"></script>
<script src="cores.js"></script>
<script src="humor.js"></script>
<script src="erros-core.js"></script>
<script src="revisao-biblioteca.js"></script>
<script src="calendario-ativo.js"></script>
<script src="plano-dinamico.js"></script>
<script src="vde-dias.js"></script>
<script src="ativo-core.js"></script>
<script src="sessao-core.js"></script>
<script>
(function () {
  var S = window.SESSAO, CAL = window.CAL_ATIVO;
  if (!S || !CAL) return;
  var COR = {
    'Direito Constitucional': 'const', 'Direito Administrativo': 'const', 'Direito Eleitoral': 'const',
    'Direito Civil': 'civil', 'Direito Processual Civil': 'civil', 'Direito do Consumidor': 'civil',
    'Direito Penal': 'penal', 'Direito Processual Penal': 'penal',
    'Direito do Trabalho': 'trab', 'Direito Processual do Trabalho': 'trab', 'Direito Previdenciário': 'trab',
    'Direito Tributário': 'tribut', 'Direito Empresarial': 'tribut',
    'Ética Profissional': 'etica', 'ECA': 'etica'
  };
  var esc = S.esc, HOJE = S.HOJE, DIA = S.DIA;
  function ler(k, p) { try { return JSON.parse(localStorage.getItem(k)) || p; } catch (e) { return p; } }
  function cor(d) { return '--cd:var(--mat-' + (COR[d] || 'const') + '-deep)'; }
  function dt(iso) { return new Date(iso + 'T12:00:00'); }
  function dm(iso) { var p = S.partes(iso); return p.d + '/' + String(p.m).padStart(2, '0'); }
  function temas(x) {
    var vist = {}, out = [];
    (x.top || []).forEach(function (t) { var k = t.d + t.s; if (!vist[k]) { vist[k] = 1; out.push(t); } });
    return out;
  }
  function htmlTemas(x) {
    return temas(x).map(function (t) { return '<div class="in-tema" style="' + cor(t.d) + '"><span>' + esc(S.curto(t.d)) + '</span><strong>' + esc(t.s) + '</strong></div>'; }).join('');
  }
  function tipoTxt(x) {
    if (x.tipo === 'simulado') return 'Simulado completo do ' + x.sim.exame + 'º Exame';
    if (x.tipo === 'prova') return 'Prova da 1ª fase, das 13h às 18h';
    if (x.tipo === 'vespera') return 'Véspera: só flashcards leves';
    if (x.tipo === 'leve') return 'Dia leve: flashcards e 10 questões de Ética';
    if (x.tipo === 'revisao') return (x.extra ? 'Revisão extra de ' : 'Revisão de ') + x.foco.map(S.curto).join(' e ');
    return '';
  }

  var checks = ler('oab_ativo_check_v1', {});

  // saudação
  var h = new Date().getHours();
  var nome = window._perfilOAB && _perfilOAB.getNome ? _perfilOAB.getNome() : '';
  document.getElementById('in-ola').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + (nome ? ', ' + nome : '');
  var faltam = Math.max(0, Math.round((dt('2027-01-10') - dt(HOJE)) / 864e5));
  var seq = 0, d = dt(HOJE);
  if (!(checks[HOJE] && checks[HOJE].feito)) d.setDate(d.getDate() - 1);
  for (;;) {
    var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (!(checks[iso] && checks[iso].feito)) break;
    seq++; d.setDate(d.getDate() - 1);
  }
  var dl = S.dataLonga(HOJE);
  document.getElementById('in-sub').innerHTML = esc(dl.charAt(0).toUpperCase() + dl.slice(1)) + '. <b>' + faltam + (faltam === 1 ? ' dia' : ' dias') + '</b> até a prova.' +
    (seq ? ' Você estudou ' + seq + (seq === 1 ? ' dia seguido.' : ' dias seguidos.') : '');

  // hoje
  if (DIA) {
    var antes = HOJE < CAL.dias[0].d;
    document.getElementById('in-hoje-tit').textContent = antes ? 'O plano começa ' + S.dataLonga(DIA.d) : DIA.top ? 'Conteúdo de hoje' : 'Hoje';
    document.getElementById('in-hoje-dia').textContent = 'Dia ' + (S.indice() + 1) + ' de ' + CAL.dias.length;
    document.getElementById('in-hoje-corpo').innerHTML = DIA.top
      ? '<div class="in-temas">' + htmlTemas(DIA) + '</div>' + (DIA.tipo === 'simulado' ? '<p class="in-tipo">' + esc(tipoTxt(DIA)) + '</p>' : '')
      : '<p class="in-tipo">' + esc(tipoTxt(DIA)) + '</p>';
    var pc = S.progressoChecklist(), ck = document.getElementById('in-ck');
    if (S.feito()) { ck.textContent = 'Dia marcado como estudado ✓'; ck.classList.add('ok'); }
    else ck.textContent = pc.feitos + ' de ' + pc.total + ' itens do checklist feitos';
    document.getElementById('in-abrir').textContent = S.feito() || pc.feitos ? 'Continuar o dia' : 'Começar o dia';
  }

  // para revisar
  function fato(href, n, txt, sub) {
    return '<a class="in-fato" href="' + href + '"><span>' + txt + (sub ? '<small>' + sub + '</small>' : '') + '</span><b>' + n + '</b></a>';
  }
  var resp = ler('oab_bq_respostas', {}), ids = Object.keys(resp), certas = ids.filter(function (k) { return resp[k].ultima_correta; }).length;
  var erros = typeof erros_total_devidas === 'function' ? erros_total_devidas() : 0;
  function lado(venc) {
    document.getElementById('in-lado').innerHTML =
      fato('revisar.html', venc == null ? '…' : venc, 'Flashcards para revisar hoje') +
      fato('erros.html', erros, 'Erros para refazer hoje', 'Caderno de erros') +
      fato('rumo40.html', ids.length, 'Questões resolvidas', ids.length ? Math.round(certas / ids.length * 100) + '% de acerto' : 'Rumo aos 40 mostra por onde começar');
  }
  lado(null);
  ATIVO.carregarCartoes().then(function () { lado(ATIVO.vencidos().length); });

  // progresso no conteúdo do VDE
  var unidades = [], porN = {};
  CAL.dias.forEach(function (x) {
    if (x.f !== 1 || !x.top) return;
    x.top.forEach(function (t) {
      if (t.n == null || porN[t.n]) return;
      porN[t.n] = { n: t.n, d: t.d, data: x.d }; unidades.push(porN[t.n]);
    });
  });
  Object.keys(checks).forEach(function (data) {
    var c = checks[data], x = CAL.dias.filter(function (y) { return y.d === data; })[0];
    Object.keys(c).forEach(function (k) { var m = /^p(\d+)$/.exec(k); if (m && c[k] && porN[m[1]]) porN[m[1]].ok = 1; });
    if (c.feito && x && x.top) x.top.forEach(function (t) { if (porN[t.n]) porN[t.n].ok = 1; });
  });
  var feitas = unidades.filter(function (u) { return u.ok; }).length;
  var fim = window.PLANO ? PLANO.fimDoConteudo() : unidades.length ? unidades[unidades.length - 1].data : null;
  document.getElementById('in-prog-txt').innerHTML = '<b>' + feitas + ' de ' + unidades.length + '</b> PDFs do dia estudados.' + (fim ? ' O último está previsto para ' + dm(fim) + '; depois vem a revisão final até a prova.' : '');
  var barra = document.getElementById('in-barra');
  barra.setAttribute('aria-label', feitas + ' de ' + unidades.length + ' PDFs estudados');
  barra.innerHTML = unidades.map(function (u) { return '<i class="' + (u.ok ? 'ok' : '') + '" style="' + cor(u.d) + '" title="Dia ' + u.n + ' do VDE, ' + esc(S.curto(u.d)) + '"></i>'; }).join('');

  // próximos dias
  var i = CAL.dias.map(function (x) { return x.d; }).indexOf(DIA ? DIA.d : HOJE);
  document.getElementById('in-prox').innerHTML = CAL.dias.slice(i + 1, i + 4).map(function (x) {
    var dl2 = S.dataLonga(x.d);
    return '<a class="in-dia" href="hoje.html?data=' + x.d + '"><em>' + esc(dl2.charAt(0).toUpperCase() + dl2.slice(1)) + '</em>' +
      (x.top && x.tipo !== 'simulado' ? htmlTemas(x) : '<p>' + esc(tipoTxt(x)) + '</p>') + '</a>';
  }).join('');

  // humor
  var btns = document.querySelectorAll('.mood-btn'), txt = document.getElementById('mood-text');
  var fmt = function (t) { return window._perfilOAB && _perfilOAB.formatarGenero ? _perfilOAB.formatarGenero(t) : t; };
  var salvo = localStorage.getItem('mood_' + HOJE);
  btns.forEach(function (b) {
    b.title = fmt(b.dataset.mood);
    if (b.dataset.mood === salvo) { b.classList.add('selected'); txt.textContent = fmt(salvo); }
    b.addEventListener('click', function () {
      btns.forEach(function (o) { o.classList.remove('selected'); });
      b.classList.add('selected');
      if (typeof HumorOAB !== 'undefined') HumorOAB.registrarHumor(b.dataset.mood);
      else localStorage.setItem('mood_' + HOJE, b.dataset.mood);
      txt.textContent = fmt(b.dataset.mood);
    });
  });
})();
</script>
<script>function resetarTudo(){if(!confirm("Apagar TODO o progresso?\nEsta acao nao pode ser desfeita."))return;var t=localStorage.getItem("theme");localStorage.clear();if(t)localStorage.setItem("theme",t);localStorage.setItem("oab_local_rev",String(Date.now()));var uid=window._syncOAB&&window._syncOAB._uid;if(uid&&window._syncOAB.enviarSnapshotCompleto){window._syncOAB.enviarSnapshotCompleto(uid).then(function(){location.reload();}).catch(function(){location.reload();});}else{location.reload();}}</script>
</body>
</html>
